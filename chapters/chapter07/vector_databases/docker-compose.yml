services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    environment:
      POSTGRES_DB: chapter07
      POSTGRES_USER: chapter07
      POSTGRES_PASSWORD: chapter07
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chapter07 -d chapter07"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - chapter07_postgres:/var/lib/postgresql/data

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
      TELEMETRY_DISABLED: "true"
    volumes:
      - chapter07_weaviate:/var/lib/weaviate

volumes:
  chapter07_postgres:
  chapter07_weaviate:
