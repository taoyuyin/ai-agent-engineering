[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-engineering-runtime"
version = "0.1.0"
description = "A teaching-oriented, enterprise-ready Agent Runtime used by AI Agent Engineering."
readme = "framework/README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3.0",
]

[tool.setuptools.packages.find]
include = ["framework*"]

[tool.pytest.ini_options]
testpaths = ["framework/tests", "examples/sql-agent/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["framework"]
